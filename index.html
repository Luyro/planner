<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расписание</title>
<meta name="app-version" content="7">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f8fafc">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Расписание">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* Цвета темы заданы здесь, а не через dark:-классы Tailwind — контраст не зависит от настроек CDN */
  :root { --bg:#f8fafc; --card:#ffffff; --inner:#f1f5f9; --bd:#e2e8f0; --tx:#0f172a; --sub:#475569; --btn:#e2e8f0; --fld:#ffffff; --fldbd:#cbd5e1; --ph:#94a3b8; color-scheme: light; }
  .dark { --bg:#0f172a; --card:#1e293b; --inner:#0f172a; --bd:#334155; --tx:#ffffff; --sub:#cbd5e1; --btn:#334155; --fld:#0f172a; --fldbd:#475569; --ph:#64748b; color-scheme: dark; }
  body { font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--tx); min-height:100vh; }
  .bar { background:var(--bg); border-color:var(--bd); }
  .card { background:var(--card); border:1px solid var(--bd); color:var(--tx); }
  .inner { background:var(--inner); border:1px solid var(--bd); }
  .sub { color:var(--sub); }
  .btn2 { background:var(--btn); color:var(--tx); }
  .btn2:hover { filter:brightness(1.12); }
  .btn2:disabled { opacity:.4; }
  .btn-main { background:#2563eb; color:#fff; } .btn-main:hover { background:#1d4ed8; }
  .btn-inv { background:var(--tx); color:var(--bg); }
  .fld { display:block; width:100%; margin-top:4px; padding:8px 10px; border-radius:10px; border:1px solid var(--fldbd); background:var(--fld); color:var(--tx); font-size:15px; }
  .fld::placeholder { color:var(--ph); }
  .fld:focus { outline:2px solid #3b82f6; outline-offset:1px; }
  .fld option { background:var(--fld); color:var(--tx); }
  .b-lk { background:#2563eb; color:#fff; } .b-pz { background:#059669; color:#fff; } .b-lr { background:#d97706; color:#fff; }
  .today { border-color:#3b82f6; box-shadow:0 0 0 2px rgba(59,130,246,.3); }
  .tab-btn.active { background:var(--card); font-weight:600; }
  nav.mobile .tab-btn { color:var(--sub); } nav.mobile .tab-btn.active { background:transparent; color:#3b82f6; }
  .f-btn { background:var(--btn); color:var(--tx); } .f-btn.active { background:var(--tx); color:var(--bg); }
  .chk { border:2px solid var(--sub); } .chk.on { background:#2563eb; border-color:#2563eb; }
  dialog { border:0; padding:0; background:transparent; max-width:100vw; } dialog::backdrop { background:rgba(2,6,23,.65); }
  .safe-b { padding-bottom:env(safe-area-inset-bottom,0px); } .safe-t { padding-top:env(safe-area-inset-top,0px); }

  .b-zc { background:#e11d48; color:#fff; } .b-zn { background:#7c3aed; color:#fff; }
  /* Окна добавления: цвета заданы явно, чтобы текст не сливался с фоном */
  .dlg { background:#ffffff; color:#0f172a; border:1px solid #e2e8f0; }
  .dlg h3 { color:#0f172a; } .dlg .lbl { color:#475569; }
  .dlg .fld { background:#ffffff; color:#0f172a; border-color:#cbd5e1; }
  .dark .dlg { background:#1e293b; color:#ffffff; border-color:#475569; }
  .dark .dlg h3 { color:#ffffff; } .dark .dlg .lbl { color:#e2e8f0; }
  .dark .dlg .fld { background:#0f172a; color:#ffffff; border-color:#64748b; }
  .dark .dlg .fld::placeholder { color:#94a3b8; }
  .dark .dlg .fld option { background:#0f172a; color:#ffffff; }
  /* Анимации */
  @keyframes up { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  @keyframes pop { 0% { transform:scale(.6); } 60% { transform:scale(1.18); } 100% { transform:scale(1); } }
  @keyframes dlgin { from { opacity:0; transform:translateY(14px) scale(.96); } to { opacity:1; transform:none; } }
  .enter > .card { animation:up .38s cubic-bezier(.2,.7,.2,1) both; animation-delay:calc(var(--i,0) * 45ms); }
  .fadein { animation:fade .25s ease both; }
  dialog[open] { animation:dlgin .22s cubic-bezier(.2,.7,.2,1); }
  dialog[open]::backdrop { animation:fade .22s ease; }
  .chk.pop { animation:pop .3s ease; }
  .card, .inner, .btn2, .btn-main, .btn-inv, .chk { transition:background-color .2s, border-color .2s, opacity .3s, transform .15s, filter .15s; }
  button:active:not(:disabled) { transform:scale(.96); }
  .card:hover { border-color:#3b82f6; }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
  [hidden] { display:none !important; }

  /* Канбан-доска домашки (адаптация дизайна: колонки-карточки, outline-бейджи, ручка перетаскивания) */
  #hwList { display:grid; gap:20px; grid-template-columns:minmax(0,1fr); align-items:start; }
  @media (min-width:768px) { #hwList { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .shadow-xs, .card, .inner { box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .kcol { padding:10px; border-radius:6px; transition:border-color .2s, box-shadow .2s; }
  .kcol.drop { border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.28); }
  .kdrop { display:flex; flex-direction:column; gap:10px; padding:2px; min-height:56px; }
  .kcard { padding:12px; cursor:grab; -webkit-user-select:none; user-select:none; }
  .kcard:focus-visible { outline:2px solid #3b82f6; outline-offset:1px; }
  .kgrip { touch-action:none; cursor:grab; color:var(--sub); padding:4px; margin:-4px; line-height:0; border-radius:6px; }
  .kghost { cursor:grabbing !important; box-shadow:0 14px 30px rgba(0,0,0,.4) !important; }
  .kempty { border:1px dashed var(--bd); border-radius:6px; padding:16px; text-align:center; font-size:12px; color:var(--sub); }
  .clamp1, .clamp2 { display:-webkit-box; -webkit-box-orient:vertical; overflow:hidden; } .clamp1 { -webkit-line-clamp:1; } .clamp2 { -webkit-line-clamp:2; }
  .kb { display:inline-flex; align-items:center; height:20px; padding:0 6px; border-radius:4px; font-size:11px; font-weight:500; border:1px solid; white-space:nowrap; }
  .kb-red { color:#b91c1c; background:#fef2f2; border-color:#fecaca; } .dark .kb-red { color:#fca5a5; background:#450a0a; border-color:#7f1d1d; }
  .kb-amber { color:#a16207; background:#fefce8; border-color:#fde68a; } .dark .kb-amber { color:#fcd34d; background:#422006; border-color:#713f12; }
  .kb-blue { color:#1d4ed8; background:#eff6ff; border-color:#bfdbfe; } .dark .kb-blue { color:#93c5fd; background:#172554; border-color:#1e3a8a; }
  .kb-gray { color:var(--sub); background:transparent; border-color:var(--bd); }
  .kb-count { display:inline-flex; align-items:center; justify-content:center; height:24px; min-width:24px; padding:0 6px; border-radius:6px; font-size:12px; background:var(--btn); color:var(--tx); }
  .kb-type { display:inline-flex; align-items:center; height:20px; padding:0 6px; border-radius:4px; font-size:11px; font-weight:500; }
</style>
</head>
<body>

<header class="bar sticky top-0 z-20 border-b safe-t" style="background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px)">
  <div class="max-w-5xl mx-auto px-4 h-14 flex items-center gap-3">
    <select id="groupSel" class="fld mr-auto font-semibold" style="width:auto;margin:0;height:36px;padding:0 10px" aria-label="Группа"></select>
    <nav class="hidden md:flex gap-1 rounded-lg p-1 inner">
      <button data-tab="schedule" class="tab-btn px-4 py-1 rounded-md text-sm">Расписание</button>
      <button data-tab="homework" class="tab-btn px-4 py-1 rounded-md text-sm">Домашка</button>
    </nav>
    <button id="notifBtn" class="btn-main text-sm px-3 py-1.5 rounded-lg">Включить напоминания</button>
    <button id="themeBtn" class="btn2 w-9 h-9 rounded-lg" aria-label="Сменить тему">🌓</button>
  </div>
</header>

<main class="max-w-5xl mx-auto px-4 py-5 pb-28 md:pb-8">
  <section id="view-schedule">
    <div class="flex flex-wrap items-center gap-2 mb-4">
      <button id="prevWeek" class="btn2 px-3 h-9 rounded-lg text-sm">← Предыдущая</button>
      <select id="weekSel" class="fld" style="width:auto;margin:0;height:36px;padding:0 10px" aria-label="Неделя"></select>
      <button id="nextWeek" class="btn2 px-3 h-9 rounded-lg text-sm">Следующая →</button>
      <select id="subSel" class="fld" style="width:auto;margin:0;height:36px;padding:0 10px" aria-label="Подгруппа"><option value="0">Обе подгруппы</option><option value="1">Подгруппа 1</option><option value="2">Подгруппа 2</option></select>
      <select id="engSel" class="fld" hidden style="width:auto;margin:0;height:36px;padding:0 10px" aria-label="Английский"><option value="0">Англ.: обе группы</option><option value="1">Англ. 1</option><option value="2">Англ. 2</option></select>
      <button id="addLesson" class="btn-inv text-sm px-3 py-1.5 rounded-lg ml-auto">+ Пара</button>
    </div>
    <div id="grid" class="grid gap-3 md:grid-cols-2 lg:grid-cols-3"></div>
  </section>

  <section id="view-homework" class="hidden">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xl font-semibold">Домашние задания</h2>
      <button id="addHw" class="btn-inv text-sm px-3 py-1.5 rounded-lg">+ Добавить ДЗ</button>
    </div>
    <div class="flex gap-2 mb-4 text-sm">
      <button data-f="all" class="f-btn px-3 py-1 rounded-full">Все</button>
      <button data-f="hot" class="f-btn px-3 py-1 rounded-full">Горящие</button>
      <button data-f="done" class="f-btn px-3 py-1 rounded-full">Выполненные</button>
    </div>
    <div id="hwList"></div>
  </section>
</main>

<nav class="mobile bar md:hidden fixed bottom-0 inset-x-0 z-20 border-t safe-b">
  <div class="grid grid-cols-2">
    <button data-tab="schedule" class="tab-btn py-3 text-sm flex flex-col items-center gap-0.5"><span class="text-lg">🗓</span>Расписание</button>
    <button data-tab="homework" class="tab-btn py-3 text-sm flex flex-col items-center gap-0.5"><span class="text-lg">✅</span>Домашка</button>
  </div>
</nav>

<dialog id="lessonDlg">
  <form id="lessonForm" class="dlg rounded-2xl p-5 w-[92vw] max-w-md space-y-3 max-h-[90vh] overflow-y-auto">
    <h3 id="lessonTitle" class="font-semibold text-lg">Пара</h3>
    <input type="hidden" name="id">
    <label class="lbl block text-sm">День
      <select name="day" class="fld"><option value="1">Понедельник</option><option value="2">Вторник</option><option value="3">Среда</option><option value="4">Четверг</option><option value="5">Пятница</option><option value="6">Суббота</option></select>
    </label>
    <div class="grid grid-cols-2 gap-3">
      <label class="lbl block text-sm">Начало<input type="time" name="start" required class="fld"></label>
      <label class="lbl block text-sm">Конец<input type="time" name="end" required class="fld"></label>
    </div>
    <label class="lbl block text-sm">Предмет<input name="name" required class="fld" placeholder="Например, Математика"></label>
    <label class="lbl block text-sm">Преподаватель<input name="teacher" class="fld" placeholder="Иванов И.И."></label>
    <label class="lbl block text-sm">Аудитория<input name="room" class="fld" placeholder="Например, 305"></label>
    <div class="grid grid-cols-2 gap-3">
      <label class="lbl block text-sm">Тип<select name="type" class="fld"><option value="ЛК">Лекция (ЛК)</option><option value="ПЗ">Практика (ПЗ)</option><option value="ЛР">Лабораторная (ЛР)</option><option value="ЗЧ">Зачёт (ЗЧ)</option><option value="ЗН">Занятие (ЗН)</option></select></label>
      <label class="lbl block text-sm">Повтор<select name="parity" class="fld"><option value="">Каждую неделю</option><option value="odd">Нечётные</option><option value="even">Чётные</option></select></label>
    </div>
    <div class="flex gap-2 pt-2">
      <button type="button" id="lessonDel" class="hidden px-3 py-2 rounded-lg text-sm mr-auto" style="color:#f87171">Удалить</button>
      <button type="button" data-close class="btn2 ml-auto px-3 py-2 rounded-lg text-sm">Отмена</button>
      <button class="btn-main px-4 py-2 rounded-lg text-sm">Сохранить</button>
    </div>
  </form>
</dialog>

<dialog id="hwDlg">
  <form id="hwForm" class="dlg rounded-2xl p-5 w-[92vw] max-w-md space-y-3 max-h-[90vh] overflow-y-auto">
    <h3 id="hwTitle" class="font-semibold text-lg">Домашнее задание</h3>
    <input type="hidden" name="id">
    <div class="grid grid-cols-3 gap-3">
      <label class="lbl block text-sm col-span-2">Предмет<select name="subject" required class="fld"></select></label>
      <label class="lbl block text-sm">Тип<select name="type" class="fld"><option value="">—</option><option>ЛК</option><option>ПЗ</option><option>ЛР</option><option>ЗЧ</option><option>ЗН</option></select></label>
    </div>
    <p id="noSubj" class="hidden text-xs" style="color:#fbbf24">Сначала добавьте пары в расписание — предметы берутся оттуда.</p>
    <label class="lbl block text-sm">Задание<textarea name="text" required rows="3" class="fld" placeholder="Что нужно сделать"></textarea></label>
    <label class="lbl block text-sm">Срок сдачи<select id="dueSel" class="fld"></select></label>
    <div id="dueWrap" class="hidden"><input type="datetime-local" id="dueInput" class="fld" aria-label="Дата и время сдачи"></div>
    <label class="lbl block text-sm">Когда напомнить о задании?
      <select id="remSel" class="fld"><option value="day8">В день сдачи (утром в 08:00)</option><option value="d1">За 1 день до сдачи</option><option value="d2">За 2 дня до сдачи</option><option value="none">Не напоминать</option><option value="custom">Указать точную дату и время…</option></select>
    </label>
    <div id="remWrap" class="hidden"><input type="datetime-local" id="remAt" class="fld" aria-label="Дата и время напоминания"></div>
    <label class="lbl block text-sm">Статус
      <select name="done" class="fld"><option value="0">В процессе</option><option value="1">Сделано</option></select>
    </label>
    <div class="flex gap-2 pt-2">
      <button type="button" id="hwDel" class="hidden px-3 py-2 rounded-lg text-sm mr-auto" style="color:#f87171">Удалить</button>
      <button type="button" data-close class="btn2 ml-auto px-3 py-2 rounded-lg text-sm">Отмена</button>
      <button class="btn-main px-4 py-2 rounded-lg text-sm">Сохранить</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
