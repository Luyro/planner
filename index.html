<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расписание</title>
<meta name="app-version" content="10">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#3e4593">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Расписание">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* Палитра референса: navy #19215f · indigo #3e4593 · periwinkle #8792ec · emerald #047857 (приглушённый) · pink #ff6297.
     Цвета темы заданы переменными — контраст не зависит от настроек Tailwind CDN. Раскладка — на Tailwind. */
  :root { --bg:#e9ebff; --hero:#3e4593; --card:#ffffff; --inner:#f2f3ff; --bd:#d6daf7; --tx:#101445; --head:#3e4593; --light:#8792ec; --sub:#4a5190; --btn:#e4e6fb; --fld:#ffffff; --fldbd:#b4bbef; --ph:#6f78bd; --green:#047857; --ring:#059669; --pink:#ff6297; --ongreen:#ffffff; color-scheme:light; }
  .dark { --bg:#0f1547; --hero:#3e4593; --card:#1c2569; --inner:#141b57; --bd:#3b4590; --tx:#ffffff; --head:#ffffff; --light:#b3bbff; --sub:#d0d5ff; --btn:#2c3688; --fld:#141b57; --fldbd:#5a66c2; --ph:#a3abf0; --green:#0f766e; --ring:#34d399; color-scheme:dark; }
  *, *::before, *::after { box-sizing:border-box; }
  * { -webkit-tap-highlight-color:transparent; }
  a, button, select, input, label { -webkit-tap-highlight-color:rgba(0,0,0,0); }
  @media (max-width:767px) { select.fld, input.fld, textarea.fld { font-size:16px; } } /* iOS не приближает страницу при фокусе в поле */
  .mainpad { padding-bottom:calc(9.5rem + env(safe-area-inset-bottom,0px)); } @media (min-width:768px) { .mainpad { padding-bottom:40px; } }
  .wrap { width:100%; max-width:1600px; margin-left:auto; margin-right:auto; }
  html { -webkit-text-size-adjust:100%; overscroll-behavior-x:none; }
  body { overscroll-behavior-x:none; -webkit-touch-callout:none; font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--tx); min-height:100vh; min-height:100dvh; }
  button { background:transparent; border:0; padding:0; font:inherit; color:inherit; cursor:pointer; }
  select, input, textarea { font-family:inherit; }
  [hidden], .hidden { display:none !important; }
  .only-md { display:none; } @media (min-width:768px) { .only-md { display:inline; } .only-md-flex { display:flex !important; } }
  .safe-t { padding-top:env(safe-area-inset-top,0px); }
  h1, h2, h3, .ttl { text-transform:uppercase; letter-spacing:-.01em; }

  /* Шапка-hero */
  .hero { background:var(--hero); color:#fff; border-radius:0 0 40px 40px; position:relative; overflow:hidden; }
  .blob { position:absolute; border-radius:9999px; pointer-events:none; }
  .blob.g { background:var(--green); width:180px; height:180px; top:-70px; right:-40px; }
  .blob.p { background:var(--pink); width:150px; height:150px; top:70px; left:-80px; }
  .hello { font-weight:900; font-size:clamp(2.4rem,8vw,3.6rem); line-height:1; letter-spacing:-.02em; }
  .hero-sub { font-weight:500; font-size:clamp(.9rem,3.2vw,1.15rem); text-transform:uppercase; opacity:.95; }
  .hero-sub b { color:#6ee7b7; font-weight:800; }
  .pill-sel { appearance:none; background:rgba(255,255,255,.16); color:#fff; border:0; border-radius:9999px; height:40px; padding:0 16px; font-weight:800; font-size:14px; font-family:inherit; }
  .pill-sel option { color:#101445; background:#fff; }
  .icon-btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:40px; min-width:40px; padding:0 10px; border-radius:9999px; background:rgba(255,255,255,.16); color:#fff; font-weight:700; font-size:13px; }
  .icon-btn[data-on="1"] { background:var(--green); color:var(--ongreen); }
  .htabs { display:none; gap:4px; padding:4px; border-radius:9999px; background:rgba(0,0,0,.2); }
  .htabs .tab-btn { padding:8px 20px; border-radius:9999px; font-weight:700; font-size:14px; color:#fff; }
  .htabs .tab-btn.active { background:var(--green); color:var(--ongreen); }

  /* Нижняя навигация (телефон) */
  .bnav { position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); z-index:30; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:4px; padding:8px; border-radius:28px; background:var(--card); border:1px solid var(--bd); box-shadow:0 12px 32px rgba(15,21,71,.3); }
  .bnav .tab-btn { display:flex; flex-direction:column; align-items:center; gap:2px; padding:7px 6px; border-radius:20px; font-size:11px; font-weight:800; color:var(--sub); transition:background-color .2s,color .2s; }
  .bnav .tab-btn.active { background:var(--green); color:var(--ongreen); }
  .fab { width:56px; height:56px; margin:-30px 10px 0; border-radius:9999px; background:var(--pink); color:#19215f; box-shadow:0 8px 20px rgba(255,98,151,.45); display:flex; align-items:center; justify-content:center; }
  @media (min-width:768px) { .bnav { display:none; } .htabs { display:flex; } }

  /* Общие компоненты */
  .card { background:var(--card); border:1px solid var(--bd); color:var(--tx); border-radius:28px; box-shadow:0 2px 6px rgba(16,20,69,.06); }
  .inner { background:var(--inner); border:1px solid var(--bd); }
  .sub { color:var(--sub); }
  .head { color:var(--head); }
  .btn2 { background:var(--btn); color:var(--tx); font-weight:700; } .btn2:hover { filter:brightness(1.1); } .btn2:disabled { opacity:.4; }
  .btn-main { background:var(--green); color:var(--ongreen); font-weight:800; } .btn-main:hover { filter:brightness(.95); }
  .btn-inv { background:var(--hero); color:#fff; font-weight:700; }
  .round-btn { width:40px; height:40px; border-radius:9999px; display:inline-flex; align-items:center; justify-content:center; font-size:18px; font-weight:800; }
  .fld { display:block; width:100%; margin-top:4px; padding:12px 14px; border-radius:16px; border:2px solid var(--fldbd); background:var(--fld); color:var(--tx); font-size:15px; font-family:inherit; min-height:48px; }
  .fld::placeholder { color:var(--ph); } .fld:focus { outline:3px solid rgba(52,211,153,.55); outline-offset:0; border-color:var(--ring); }
  .fld option { background:var(--fld); color:var(--tx); }
  .lbl { color:var(--sub); font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.03em; }
  .b-lk { background:#4f5bd5; color:#fff; } .b-pz { background:var(--green); color:var(--ongreen); } .b-lr { background:#e5266f; color:#fff; } .b-zc { background:#f59e0b; color:#2a1a00; } .b-zn { background:#7c3aed; color:#fff; }
  .tbadge { display:inline-flex; align-items:center; height:22px; padding:0 8px; border-radius:9999px; font-size:11px; font-weight:800; flex-shrink:0; }

  /* Расписание */
  .dstrip { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; }
  .dchip { display:flex; flex-direction:column; align-items:center; gap:2px; padding:10px 0 8px; border-radius:9999px; color:var(--tx); font-weight:700; transition:background-color .2s; }
  .dchip .dn { font-size:11px; text-transform:uppercase; font-weight:800; color:var(--sub); } .dchip .dd { font-size:17px; font-weight:800; }
  .dchip i { width:5px; height:5px; border-radius:9999px; background:var(--pink); } .dchip i.off { background:transparent; }
  .dchip.sel { background:var(--green); color:var(--ongreen); } .dchip.sel .dn { color:var(--ongreen); }
  .dchip.tod .dd { text-decoration:underline; text-underline-offset:3px; }
  #grid { display:grid; grid-template-columns:minmax(0,1fr); gap:16px; max-width:640px; margin:0 auto; min-height:55dvh; touch-action:pan-y; }
  .daycol { display:none; padding:16px; } .daycol.sel { display:block; }
  @keyframes slideL { from { opacity:0; transform:translateX(36px); } to { opacity:1; transform:none; } }
  @keyframes slideR { from { opacity:0; transform:translateX(-36px); } to { opacity:1; transform:none; } }
  .daycol.slide-l { animation:slideL .28s cubic-bezier(.2,.8,.2,1) both; } .daycol.slide-r { animation:slideR .28s cubic-bezier(.2,.8,.2,1) both; }
  .daycol.today { border-color:var(--ring); box-shadow:0 0 0 3px rgba(52,211,153,.3); }
  .dayhead { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; }
  .dayhead h3 { font-weight:900; font-size:15px; color:var(--head); }
  .todaypill { background:var(--green); color:var(--ongreen); font-size:10px; font-weight:800; text-transform:uppercase; padding:3px 9px; border-radius:9999px; }
  .lesson { display:flex; gap:12px; padding:12px; border-radius:20px; }
  .tcol { display:flex; flex-direction:column; align-items:center; justify-content:flex-start; min-width:46px; line-height:1.15; }
  .tcol b { font-size:15px; font-weight:800; } .tcol span { font-size:11px; font-weight:600; color:var(--sub); }
  .vdiv { width:2px; border-radius:2px; background:var(--bd); align-self:stretch; }
  .lname { font-weight:800; font-size:14px; line-height:1.25; text-align:left; color:var(--tx); }
  .lmeta { display:flex; align-items:flex-start; gap:5px; font-size:12px; font-weight:500; color:var(--sub); margin-top:4px; }
  .lmeta svg { color:var(--pink); flex-shrink:0; margin-top:1px; }
  .hwbtn { margin-top:8px; min-height:32px; padding:0 14px; border-radius:9999px; background:var(--green); color:var(--ongreen); font-size:12px; font-weight:800; }
  .empty { border:2px dashed var(--bd); border-radius:20px; padding:18px; text-align:center; font-size:13px; font-weight:600; color:var(--sub); }

  /* Домашка: канбан */
  #hwList { display:grid; gap:20px; grid-template-columns:minmax(0,1fr); align-items:start; }
  @media (min-width:768px) { #hwList { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .f-btn { background:var(--btn); color:var(--tx); font-weight:700; } .f-btn.active { background:var(--green); color:var(--ongreen); }
  .kcol { padding:16px; border-radius:28px; transition:border-color .2s, box-shadow .2s; }
  .kcol.drop { border-color:var(--ring); box-shadow:0 0 0 4px rgba(52,211,153,.35); }
  .kdrop { display:flex; flex-direction:column; gap:10px; padding:2px; min-height:56px; }
  .kcard { padding:14px; border-radius:20px; cursor:grab; -webkit-user-select:none; user-select:none; }
  .kcard:focus-visible { outline:3px solid var(--ring); }
  .kgrip { touch-action:none; cursor:grab; color:var(--sub); padding:6px; margin:-6px; line-height:0; border-radius:8px; }
  .kghost { cursor:grabbing !important; box-shadow:0 16px 34px rgba(0,0,0,.45) !important; }
  .kempty { border:2px dashed var(--bd); border-radius:16px; padding:16px; text-align:center; font-size:12px; font-weight:600; color:var(--sub); }
  .clamp1, .clamp2 { display:-webkit-box; -webkit-box-orient:vertical; overflow:hidden; } .clamp1 { -webkit-line-clamp:1; } .clamp2 { -webkit-line-clamp:2; }
  .kb { display:inline-flex; align-items:center; height:22px; padding:0 8px; border-radius:9999px; font-size:11px; font-weight:800; border:1px solid; white-space:nowrap; }
  .kb-red { color:#b3123f; background:#ffe4ed; border-color:#ffb3cb; } .dark .kb-red { color:#ffb3cb; background:#4a0f2b; border-color:#8a2350; }
  .kb-amber { color:#8a5300; background:#fff3d1; border-color:#ffd97a; } .dark .kb-amber { color:#ffd97a; background:#41300a; border-color:#7a5a12; }
  .kb-blue { color:#2c3798; background:#e6e9ff; border-color:#c3c9ff; } .dark .kb-blue { color:#c3c9ff; background:#232d7a; border-color:#4a56b8; }
  .kb-gray { color:var(--sub); background:transparent; border-color:var(--bd); }
  .kb-count { display:inline-flex; align-items:center; justify-content:center; height:24px; min-width:24px; padding:0 8px; border-radius:9999px; font-size:12px; font-weight:800; background:var(--pink); color:#19215f; }
  .kb-type { display:inline-flex; align-items:center; height:22px; padding:0 8px; border-radius:9999px; font-size:11px; font-weight:800; }
  .chk { border:3px solid var(--pink); transition:background-color .2s,border-color .2s; } .chk.on { background:var(--green); border-color:var(--green); } .chk svg { stroke:var(--ongreen); }

  /* Окна: снизу на телефоне, по центру с blur на ПК */
  dialog { border:0; padding:0; background:transparent; max-width:100vw; max-height:100dvh; width:100%; margin:auto auto 0; overflow:visible; color:var(--tx); }
  dialog::backdrop { background:rgba(10,14,60,.6); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
  .sheet { background:var(--card); color:var(--tx); border:1px solid var(--bd); border-radius:32px 32px 0 0; padding:12px 20px calc(20px + env(safe-area-inset-bottom,0px)); width:100%; max-height:92dvh; overflow-y:auto; display:flex; flex-direction:column; gap:12px; }
  .sheet h3 { font-weight:900; font-size:20px; color:var(--head); }
  .grab { height:30px; width:100%; margin:-6px 0 -8px; display:flex; align-items:center; justify-content:center; touch-action:none; cursor:pointer; }
  .grab::before { content:''; width:44px; height:5px; border-radius:9999px; background:var(--light); opacity:.8; }
  .sheet h3 { touch-action:none; }
  @media (min-width:768px) { dialog { width:fit-content; margin:auto; } .sheet { width:min(30rem,92vw); border-radius:32px; padding:24px; max-height:90vh; } .grab { display:none; } }
  .duebtn { display:flex; align-items:center; gap:10px; width:100%; margin-top:4px; padding:12px 14px; min-height:52px; border-radius:16px; background:var(--inner); border:2px solid var(--ring); color:var(--tx); font-weight:700; font-size:14px; text-align:left; }
  .duebtn svg { color:var(--pink); flex-shrink:0; }
  .cal { margin-top:8px; padding:12px; border-radius:20px; background:var(--inner); border:1px solid var(--bd); }
  .calnav { width:36px; height:36px; border-radius:9999px; background:var(--btn); color:var(--tx); font-size:18px; font-weight:800; }
  .calhead, .calgrid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; }
  .calhead { font-size:11px; font-weight:800; color:var(--sub); text-transform:uppercase; margin-bottom:4px; }
  .cday { position:relative; height:42px; border-radius:14px; font-weight:600; font-size:14px; color:var(--tx); display:flex; align-items:center; justify-content:center; }
  .cday:disabled { opacity:.3; }
  .cday.has { background:rgba(52,211,153,.18); box-shadow:inset 0 0 0 2px var(--ring); font-weight:800; }
  .cday.has i { position:absolute; bottom:4px; width:5px; height:5px; border-radius:9999px; background:var(--pink); }
  .cday.tod span { text-decoration:underline; text-underline-offset:3px; }
  .cday.sel { background:var(--green); color:var(--ongreen); box-shadow:none; font-weight:800; } .cday.sel i { background:var(--ongreen); }

  /* Анимации */
  @keyframes up { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  @keyframes pop { 0% { transform:scale(.6); } 60% { transform:scale(1.18); } 100% { transform:scale(1); } }
  @keyframes sheetup { from { transform:translateY(100%); } to { transform:none; } }
  @keyframes dlgin { from { opacity:0; transform:translateY(14px) scale(.96); } to { opacity:1; transform:none; } }
  .enter > .card { animation:up .4s cubic-bezier(.2,.7,.2,1) both; animation-delay:calc(var(--i,0) * 45ms); }
  .fadein { animation:fade .25s ease both; }
  dialog[open] .sheet { animation:sheetup .28s cubic-bezier(.2,.8,.2,1); } dialog[open]::backdrop { animation:fade .25s ease; }
  @media (min-width:768px) { dialog[open] .sheet { animation:dlgin .22s cubic-bezier(.2,.7,.2,1); } }
  .chk.pop { animation:pop .3s ease; }
  button { transition:transform .15s, filter .15s, background-color .2s; } button:active:not(:disabled) { transform:scale(.96); }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
  /* Десктоп ≥1024px: вся неделя — 6 колонок в ряд (правила стоят после базовых, чтобы их переопределять) */
  @media (min-width:1024px) {
    .dstrip { display:none; }
    #grid { grid-template-columns:repeat(6,minmax(0,1fr)); gap:10px; max-width:none; min-height:0; align-items:start; }
    .daycol { display:block; padding:10px; border-radius:22px; min-width:0; }
    .dayhead { flex-direction:column; align-items:flex-start; justify-content:flex-start; gap:4px; min-height:58px; margin-bottom:10px; }
    .dayhead h3 { font-size:12px; line-height:1.15; } .dayhead h3 span { display:block; margin-top:2px; }
    .lesson { flex-direction:column; gap:6px; padding:9px; border-radius:16px; }
    .vdiv { display:none; }
    .tcol { flex-direction:row; align-items:baseline; gap:4px; min-width:0; } .tcol b { font-size:13px; } .tcol span { font-size:11px; } .tcol span::before { content:'– '; }
    .lrow { flex-direction:column-reverse; align-items:flex-start; gap:6px; }
    .lname { font-size:12px; overflow-wrap:break-word; } .lmeta { font-size:11px; overflow-wrap:break-word; }
    .hwbtn { margin-top:6px; min-height:28px; padding:0 12px; }
  }
  @media (min-width:1280px) { #grid { gap:12px; } .daycol { padding:12px; } .dayhead h3 { font-size:13px; } .lesson { padding:10px; } .lname { font-size:13px; } }
</style>
</head>
<body>

<header class="hero safe-t">
  <span class="blob g"></span><span class="blob p"></span>
  <div class="relative wrap mx-auto px-4 pt-4 pb-7 md:pb-9">
    <div class="flex items-center gap-2">
      <select id="groupSel" class="pill-sel" aria-label="Группа"></select>
      <nav class="htabs ml-auto mr-2">
        <button data-tab="schedule" class="tab-btn">Расписание</button>
        <button data-tab="homework" class="tab-btn">Домашка</button>
      </nav>
      <button id="notifBtn" class="icon-btn ml-auto md:ml-0" data-on="0" aria-label="Напоминания">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span id="notifTxt" class="only-md">Включить напоминания</span>
      </button>
      <button id="themeBtn" class="icon-btn" aria-label="Сменить тему">🌓</button>
    </div>
    <h1 class="hello mt-6">Привет!</h1>
    <p id="heroSub" class="hero-sub mt-1"></p>
  </div>
</header>

<div id="notifBanner" hidden class="wrap mx-auto px-4 pt-4">
  <div class="card flex items-center gap-3 flex-wrap" style="padding:14px 16px;border-radius:24px">
    <span aria-hidden="true">🔔</span>
    <p id="notifMsg" class="flex-1 text-sm font-semibold" style="min-width:200px"></p>
    <button id="notifAsk" class="btn-main px-5 h-10 rounded-full text-sm">Разрешить</button>
    <button id="notifHide" class="btn2 px-4 h-10 rounded-full text-sm">Скрыть</button>
  </div>
</div>

<main class="wrap mx-auto px-4 pt-6 mainpad">
  <section id="view-schedule">
    <div class="flex flex-wrap items-end justify-between gap-3 mb-4">
      <div>
        <h2 class="ttl head font-black text-3xl md:text-4xl leading-none" id="weekTitle">Неделя</h2>
        <p class="ttl font-medium text-base md:text-lg mt-1" style="color:var(--light)" id="weekRange"></p>
      </div>
      <button id="addLesson" class="btn-inv hidden md:inline-flex items-center px-5 h-11 rounded-full text-sm">+ Пара</button>
    </div>
    <div class="flex flex-wrap items-center gap-2 mb-4">
      <button id="prevWeek" class="btn2 round-btn" aria-label="Предыдущая неделя">‹</button>
      <select id="weekSel" class="fld" style="width:auto;margin:0;min-height:40px;padding:0 14px;border-radius:9999px" aria-label="Неделя"></select>
      <button id="nextWeek" class="btn2 round-btn" aria-label="Следующая неделя">›</button>
      <select id="subSel" class="fld" style="width:auto;margin:0;min-height:40px;padding:0 14px;border-radius:9999px" aria-label="Подгруппа"><option value="0">Обе подгруппы</option><option value="1">Подгруппа 1</option><option value="2">Подгруппа 2</option></select>
      <select id="engSel" class="fld" hidden style="width:auto;margin:0;min-height:40px;padding:0 14px;border-radius:9999px" aria-label="Английский"><option value="0">Англ.: обе группы</option><option value="1">Англ. 1</option><option value="2">Англ. 2</option></select>
    </div>
    <div id="dayStrip" class="dstrip mb-4"></div>
    <div id="grid"></div>
  </section>

  <section id="view-homework" class="hidden">
    <div class="flex items-end justify-between gap-3 mb-4">
      <div>
        <h2 class="ttl head font-black text-3xl md:text-4xl leading-none">Домашка</h2>
        <p class="ttl font-medium text-base md:text-lg mt-1" style="color:var(--light)">Задачи и дедлайны</p>
      </div>
      <button id="addHw" class="btn-inv hidden md:inline-flex items-center px-5 h-11 rounded-full text-sm">+ Добавить ДЗ</button>
    </div>
    <div class="flex flex-wrap gap-2 mb-5 text-sm">
      <button data-f="all" class="f-btn px-4 h-10 rounded-full">Все</button>
      <button data-f="hot" class="f-btn px-4 h-10 rounded-full">Горящие</button>
      <button data-f="done" class="f-btn px-4 h-10 rounded-full">Выполненные</button>
    </div>
    <div id="hwList"></div>
  </section>
</main>

<nav class="bnav" aria-label="Навигация">
  <button data-tab="schedule" class="tab-btn">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="4"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Расписание
  </button>
  <button id="fab" class="fab" aria-label="Добавить">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button data-tab="homework" class="tab-btn">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>Домашка
  </button>
</nav>

<dialog id="lessonDlg">
  <form id="lessonForm" class="sheet">
    <div class="grab"></div>
    <h3 id="lessonTitle">Пара</h3>
    <input type="hidden" name="id">
    <label class="lbl block">День
      <select name="day" class="fld"><option value="1">Понедельник</option><option value="2">Вторник</option><option value="3">Среда</option><option value="4">Четверг</option><option value="5">Пятница</option><option value="6">Суббота</option></select>
    </label>
    <label class="lbl block">Время пары<select id="slotSel" class="fld"></select></label>
    <div id="timeWrap" class="hidden grid grid-cols-2 gap-3">
      <label class="lbl block">Начало<input type="time" name="start" class="fld"></label>
      <label class="lbl block">Конец<input type="time" name="end" class="fld"></label>
    </div>
    <label class="lbl block">Предмет<input name="name" required class="fld" placeholder="Например, Математика"></label>
    <label class="lbl block">Преподаватель<input name="teacher" class="fld" placeholder="Иванов И.И."></label>
    <label class="lbl block">Аудитория<input name="room" class="fld" placeholder="Например, 1/305"></label>
    <div class="grid grid-cols-2 gap-3">
      <label class="lbl block">Тип<select name="type" class="fld"><option value="ЛК">Лекция (ЛК)</option><option value="ПЗ">Практика (ПЗ)</option><option value="ЛР">Лабораторная (ЛР)</option><option value="ЗЧ">Зачёт (ЗЧ)</option><option value="ЗН">Занятие (ЗН)</option></select></label>
      <label class="lbl block">Повтор<select name="parity" class="fld"><option value="">Каждую неделю</option><option value="odd">Нечётные</option><option value="even">Чётные</option></select></label>
    </div>
    <div class="flex gap-2 pt-2">
      <button type="button" id="lessonDel" class="hidden px-4 h-12 rounded-full text-sm font-bold mr-auto" style="color:#ff7a9c">Удалить</button>
      <button type="button" data-close class="btn2 ml-auto px-5 h-12 rounded-full text-sm">Отмена</button>
      <button class="btn-main px-6 h-12 rounded-full text-sm">Сохранить</button>
    </div>
  </form>
</dialog>

<dialog id="hwDlg">
  <form id="hwForm" class="sheet">
    <div class="grab"></div>
    <h3 id="hwTitle">Домашнее задание</h3>
    <input type="hidden" name="id">
    <div class="grid grid-cols-3 gap-3">
      <label class="lbl block col-span-2">Предмет<select name="subject" required class="fld"></select></label>
      <label class="lbl block">Тип<select name="type" class="fld"><option value="">—</option><option>ЛК</option><option>ПЗ</option><option>ЛР</option><option>ЗЧ</option><option>ЗН</option></select></label>
    </div>
    <p id="noSubj" class="hidden text-xs font-semibold" style="color:#ffd97a">Сначала добавьте пары в расписание — предметы берутся оттуда.</p>
    <label class="lbl block">Задание<textarea name="text" required rows="3" class="fld" placeholder="Что нужно сделать"></textarea></label>
    <div>
      <div class="lbl">Срок сдачи</div>
      <button type="button" id="dueBtn" class="duebtn" aria-expanded="false" aria-controls="cal">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="4"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span id="dueText" class="flex-1">Выберите срок сдачи</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div id="cal" class="cal" hidden>
        <div class="flex items-center justify-between mb-3">
          <button type="button" id="calPrev" class="calnav" aria-label="Предыдущий месяц">‹</button>
          <b id="calMonth" class="ttl text-sm"></b>
          <button type="button" id="calNext" class="calnav" aria-label="Следующий месяц">›</button>
        </div>
        <div class="calhead"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
        <div id="calGrid" class="calgrid"></div>
        <p id="calLegend" class="text-xs font-semibold sub mt-3"></p>
        <label class="lbl block mt-3">Время, если выбран другой день<input type="time" id="calTime" class="fld" value="09:00"></label>
      </div>
    </div>
    <label class="lbl block">Когда напомнить о задании?
      <select id="remSel" class="fld"><option value="eve19">Накануне вечером (19:00)</option><option value="day8">В день сдачи (утром в 08:00)</option><option value="d1">За 1 день до сдачи</option><option value="d2">За 2 дня до сдачи</option><option value="none">Не напоминать</option><option value="custom">Указать точную дату и время…</option></select>
    </label>
    <div id="remWrap" class="hidden"><input type="datetime-local" id="remAt" class="fld" aria-label="Дата и время напоминания"></div>
    <label class="lbl block">Статус
      <select name="done" class="fld"><option value="0">В процессе</option><option value="1">Сделано</option></select>
    </label>
    <div class="flex gap-2 pt-2">
      <button type="button" id="hwDel" class="hidden px-4 h-12 rounded-full text-sm font-bold mr-auto" style="color:#ff7a9c">Удалить</button>
      <button type="button" data-close class="btn2 ml-auto px-5 h-12 rounded-full text-sm">Отмена</button>
      <button class="btn-main px-6 h-12 rounded-full text-sm">Сохранить</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
